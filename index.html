<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FORKT Engine - Luau UI Previewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&display=swap');

        * {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #09090c;
            color: #e2e8f0;
            overflow: hidden;
        }

        .code-editor {
            font-family: 'Fira Code', monospace;
            background-color: #121218;
            resize: none;
            scrollbar-width: thin;
            scrollbar-color: #2a2a3c transparent;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2a3c;
            border-radius: 4px;
        }

        /* Efek Glassmorphism & Glow */
        .glass-panel {
            background: rgba(18, 18, 24, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }

        .glow-btn {
            box-shadow: 0 4px 20px rgba(120, 80, 255, 0.35);
        }
    </style>
</head>
<body class="h-dvh w-screen flex flex-col justify-between">

    <header class="h-14 bg-[#0e0e13] border-b border-[#1f1f2e] px-4 flex items-center justify-between z-30 shrink-0">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-[#7850ff] to-[#5030b5] flex items-center justify-center glow-btn">
                <i class="fa-solid fa-terminal text-white text-xs"></i>
            </div>
            <div>
                <h1 class="text-xs font-bold text-white tracking-wider">FORKT ENGINE</h1>
                <p class="text-[9px] text-[#8a8a9e]">Luau UI Previewer v2.0</p>
            </div>
        </div>

        <div class="flex bg-[#161622] p-1 rounded-xl border border-[#232336] md:hidden">
            <button id="btn-tab-editor" onclick="switchMobileTab('editor')" class="px-3 py-1.5 rounded-lg text-[10px] font-bold bg-[#7850ff] text-white transition-all shadow-sm">
                <i class="fa-solid fa-code mr-1"></i> Editor
            </button>
            <button id="btn-tab-preview" onclick="switchMobileTab('preview')" class="px-3 py-1.5 rounded-lg text-[10px] font-bold text-[#8a8a9e] transition-all">
                <i class="fa-solid fa-eye mr-1"></i> Preview
            </button>
        </div>

        <button onclick="runPreview()" class="hidden md:flex items-center gap-2 bg-[#7850ff] hover:bg-[#8c64ff] text-white px-4 py-2 rounded-xl text-xs font-bold glow-btn transition-all active:scale-95 cursor-pointer">
            <i class="fa-solid fa-play"></i> Run Preview
        </button>
    </header>

    <main class="flex-grow flex flex-col md:flex-row relative overflow-hidden">
        
        <section id="pane-editor" class="absolute inset-0 md:relative md:inset-auto w-full md:w-1/2 h-full flex flex-col bg-[#09090c] z-10 transition-opacity duration-200">
            <div class="flex-grow p-3 md:p-4 flex flex-col">
                <div class="flex items-center justify-between mb-2 px-1">
                    <span class="text-[10px] font-bold uppercase tracking-widest text-[#8a8a9e]">Script Luau Source</span>
                    <span class="text-[10px] font-mono text-[#7850ff]">Auto-Sync active</span>
                </div>
                <textarea id="luau-code" class="code-editor flex-grow w-full p-3 md:p-4 text-xs text-[#a78bfa] rounded-2xl outline-none border border-[#1f1f2e] focus:border-[#7850ff] transition-colors shadow-inner" spellcheck="false">--[[
    ╔══════════════════════════════════════════════╗
    ║   OBSTACLE REPLACER - FORKT ENGINE           ║
    ║   Mobile Portrait Optimized                  ║
    ╚══════════════════════════════════════════════╝
]]

local ScreenGui = Instance.new("ScreenGui")
-- [Editor siap memuat komponen UI]</textarea>
            </div>
            
            <div class="p-3 bg-[#0e0e13] border-t border-[#1f1f2e] md:hidden shrink-0">
                <button onclick="runPreview()" class="w-full bg-[#7850ff] text-white py-3 rounded-xl text-xs font-bold glow-btn flex items-center justify-center gap-2 active:scale-95 transition-all">
                    <i class="fa-solid fa-play"></i> Run & Generate Preview
                </button>
            </div>
        </section>

        <section id="pane-preview" class="absolute inset-0 md:relative md:inset-auto w-full md:w-1/2 h-full flex flex-col items-center justify-center bg-[#07070a] p-3 md:p-6 z-0 md:z-10 transition-opacity duration-200">
            
            <div class="absolute inset-0 bg-[radial-gradient(#161622_1px,transparent_1px)] [background-size:20px_20px] opacity-60 pointer-events-none"></div>

            <div class="w-full max-w-[340px] h-full max-h-[620px] bg-[#0c0c10] rounded-[2.5rem] border-[6px] border-[#1f1f2e] shadow-2xl flex flex-col relative overflow-hidden shrink-0">
                
                <div class="absolute top-0 left-1/2 -translate-x-1/2 w-28 h-5 bg-[#1f1f2e] rounded-b-xl z-30"></div>

                <div class="w-full h-full pt-8 pb-3 px-3 flex items-center justify-center relative overflow-hidden">
                    
                    <div id="simulated-panel" class="w-full h-full max-h-[540px] bg-[#0f0f15] rounded-2xl border border-[#232338] shadow-2xl flex flex-col overflow-hidden relative">
                        
                        <div class="h-11 bg-[#14141d] border-b border-[#232338] px-3 flex items-center justify-between shrink-0">
                            <div class="flex items-center gap-2">
                                <div class="w-2 h-2 rounded-full bg-[#7850ff]"></div>
                                <span class="text-xs font-bold text-white tracking-wide">FORKT Engine</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <button class="w-6 h-6 rounded-lg bg-[#1a1a26] text-gray-400 text-xs font-bold flex items-center justify-center hover:text-white">−</button>
                                <button class="w-6 h-6 rounded-lg bg-[#1a1a26] text-gray-400 text-xs font-bold flex items-center justify-center hover:text-red-400">×</button>
                            </div>
                        </div>

                        <div class="flex-grow p-3 flex flex-col gap-2.5 overflow-y-auto">
                            
                            <span class="text-[9px] font-bold text-[#7a7a93] uppercase tracking-wider">REPLACEMENT DATA</span>
                            
                            <div class="glass-panel rounded-xl p-3 flex flex-col justify-between h-20 shadow-sm">
                                <span class="text-[9px] font-bold text-[#7a7a93]">SOURCE MODEL</span>
                                <span class="text-xs font-bold text-white truncate">📂 Forest_Map_Pack</span>
                                <div class="flex justify-between items-center">
                                    <span class="text-[9px] text-[#7a7a93]">14 objects loaded</span>
                                    <span class="text-[9px] font-bold text-[#7850ff] bg-[#7850ff]/10 px-2.5 py-1 rounded-lg border border-[#7850ff]/20">SELECT</span>
                                </div>
                            </div>

                            <div class="glass-panel rounded-xl p-3 flex flex-col justify-between h-20 shadow-sm">
                                <span class="text-[9px] font-bold text-[#7a7a93]">TARGET POOL</span>
                                <span class="text-xs font-bold text-white truncate">📦 SciFi_Wall_Asset</span>
                                <div class="flex justify-between items-center">
                                    <span class="text-[9px] text-[#7a7a93]">5 variants loaded</span>
                                    <span class="text-[9px] font-bold text-[#7850ff] bg-[#7850ff]/10 px-2.5 py-1 rounded-lg border border-[#7850ff]/20">SELECT</span>
                                </div>
                            </div>

                            <span class="text-[9px] font-bold text-[#7a7a93] uppercase tracking-wider mt-1">EXECUTION</span>

                            <button class="w-full bg-[#7850ff] hover:bg-[#8c64ff] text-white py-3 rounded-xl text-xs font-bold glow-btn active:scale-98 transition-all">
                                REPLACE 14 OBJECTS
                            </button>

                            <div class="text-center pb-2">
                                <span class="text-[10px] text-[#7a7a93] hover:text-white cursor-pointer underline underline-offset-4">Clear All Selection</span>
                            </div>
                        </div>

                        <div class="h-7 bg-[#121219] border-t border-[#232338] px-3 flex items-center gap-2 shrink-0">
                            <span class="text-[#41dc87] text-[8px] animate-pulse">●</span>
                            <span class="text-[9px] text-[#7a7a93] truncate">Authenticated successfully. Ready.</span>
                        </div>

                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        function switchMobileTab(tab) {
            const paneEditor = document.getElementById('pane-editor');
            const panePreview = document.getElementById('pane-preview');
            const btnEditor = document.getElementById('btn-tab-editor');
            const btnPreview = document.getElementById('btn-tab-preview');

            if (tab === 'editor') {
                paneEditor.style.zIndex = '20';
                panePreview.style.zIndex = '10';
                btnEditor.className = "px-3 py-1.5 rounded-lg text-[10px] font-bold bg-[#7850ff] text-white transition-all shadow-sm";
                btnPreview.className = "px-3 py-1.5 rounded-lg text-[10px] font-bold text-[#8a8a9e] transition-all";
            } else {
                paneEditor.style.zIndex = '10';
                panePreview.style.zIndex = '20';
                btnPreview.className = "px-3 py-1.5 rounded-lg text-[10px] font-bold bg-[#7850ff] text-white transition-all shadow-sm";
                btnEditor.className = "px-3 py-1.5 rounded-lg text-[10px] font-bold text-[#8a8a9e] transition-all";
            }
        }

        function runPreview() {
            // Otomatis pindah ke tab preview jika diakses via perangkat mobile portrait
            if (window.innerWidth < 768) {
                switchMobileTab('preview');
            }
            
            // Efek animasi feedback saat tombol Run ditekan
            const panel = document.getElementById('simulated-panel');
            panel.style.transform = 'scale(0.97)';
            setTimeout(() => {
                panel.style.transform = 'scale(1)';
            }, 180);
        }

        // Penyesuaian otomatis layout saat ukuran jendela berubah (Resize Handler)
        window.addEventListener('resize', () => {
            if (window.innerWidth >= 768) {
                document.getElementById('pane-editor').style.zIndex = '10';
                document.getElementById('pane-preview').style.zIndex = '10';
            }
        });
    </script>
</body>
</html>
