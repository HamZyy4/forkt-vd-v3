<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORKT Engine - Luau UI Previewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f0f14;
            color: #e2e8f0;
        }

        .code-editor {
            font-family: 'Fira Code', monospace;
            background-color: #16161f;
            resize: none;
            scrollbar-width: thin;
            scrollbar-color: #2d2d3d transparent;
        }

        /* Mockup Layar HP Portrait Mode */
        .mobile-mockup {
            width: 100%;
            max-width: 360px;
            aspect-ratio: 9/18.5;
            background-color: #0d0d12;
            margin: 0 auto;
            border-radius: 2.5rem;
            border: 8px solid #222230;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 22px;
            background-color: #222230;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
            z-index: 50;
        }
    </style>
</head>
<body class="h-screen flex flex-col md:flex-row overflow-hidden">

    <div id="editor-section" class="w-full md:w-1/2 h-full flex flex-col border-r border-[#222230]">
        <div class="p-4 bg-[#121219] flex justify-between items-center border-b border-[#222230] shadow-md">
            <h1 class="text-base font-bold text-white flex items-center">
                <i class="fa-solid fa-code text-[#7850ff] mr-2.5"></i> FORKT Engine Previewer
            </h1>
            <button onclick="parseAndPreview()" class="bg-[#7850ff] hover:bg-[#8c64ff] text-white px-4 py-2 rounded-lg text-xs font-bold shadow-lg shadow-[#7850ff]/20 transition-all active:scale-95 flex items-center gap-2">
                <i class="fa-solid fa-play"></i> Run Preview
            </button>
        </div>
        
        <div class="flex-grow p-3 bg-[#0f0f14] relative">
            <textarea id="luau-code" class="code-editor w-full h-full p-3 text-xs text-[#a78bfa] rounded-xl outline-none border border-[#222230] focus:border-[#7850ff] transition-colors shadow-inner" spellcheck="false">--[[
    ╔══════════════════════════════════════════════╗
    ║   OBSTACLE REPLACER - FORKT ENGINE           ║
    ║   Preview Mode | Mobile Responsive           ║
    ╚══════════════════════════════════════════════╝
]]

local ScreenGui = Instance.new("ScreenGui")
-- [Simulasi Parser Komponen Utama]
-- Script di atas mendeteksi struktur UI berikut:</textarea>
        </div>
    </div>

    <div id="preview-section" class="w-full md:w-1/2 h-full bg-[#09090c] flex flex-col relative hidden md:flex">
        
        <div class="md:hidden flex bg-[#121219] p-2 gap-2 border-b border-[#222230]">
            <button onclick="switchTab('editor')" class="flex-1 py-2 rounded-lg bg-[#1a1a24] text-gray-400 text-xs font-semibold shadow">Editor Code</button>
            <button onclick="switchTab('preview')" class="flex-1 py-2 rounded-lg bg-[#7850ff] text-white text-xs font-semibold shadow">Live Preview</button>
        </div>

        <div class="flex-grow flex items-center justify-center p-4">
            <div class="mobile-mockup">
                <div class="notch"></div>
                
                <div class="w-full h-full pt-8 pb-4 px-3 flex items-center justify-center bg-[radial-gradient(#1e1e2d_1px,transparent_1px)] [background-size:16px_16px]">
                    
                    <div id="simulated-panel" class="w-full max-w-[310px] bg-[#0f0f14] rounded-xl border border-[#2d2d41] shadow-2xl flex flex-col overflow-hidden relative" style="height: 400px;">
                        
                        <div class="h-[42px] bg-[#16161e] border-b border-[#2d2d41] flex items-center justify-between px-3 relative z-10">
                            <span class="text-xs font-bold text-white tracking-wide">FORKT Engine</span>
                            <div class="flex gap-1.5 items-center">
                                <span class="text-gray-400 font-bold text-sm cursor-pointer hover:text-white px-1">−</span>
                                <span class="text-gray-400 font-bold text-sm cursor-pointer hover:text-red-400 px-1">×</span>
                            </div>
                        </div>

                        <div class="flex-grow p-3 flex flex-col gap-2.5 overflow-y-auto">
                            
                            <span class="text-[9px] font-bold text-[#a0a0af] uppercase tracking-wider">REPLACEMENT DATA</span>
                            
                            <div class="bg-[#1a1a24] border border-[#2d2d41] rounded-lg p-2.5 flex flex-col justify-between h-[75px]">
                                <span class="text-[9px] font-bold text-[#a0a0af]">SOURCE MODEL</span>
                                <span class="text-[11px] font-bold text-white truncate">📂 Forest_Map_Pack</span>
                                <div class="flex justify-between items-center">
                                    <span class="text-[9px] text-[#a0a0af]">14 items loaded</span>
                                    <button class="bg-[#0f0f14] border border-[#2d2d41] text-[#7850ff] px-2.5 py-1 rounded text-[9px] font-bold">SELECT</button>
                                </div>
                            </div>

                            <div class="bg-[#1a1a24] border border-[#2d2d41] rounded-lg p-2.5 flex flex-col justify-between h-[75px]">
                                <span class="text-[9px] font-bold text-[#a0a0af]">TARGET POOL</span>
                                <span class="text-[11px] font-bold text-white truncate">📦 SciFi_Wall_Asset</span>
                                <div class="flex justify-between items-center">
                                    <span class="text-[9px] text-[#a0a0af]">5 variants loaded</span>
                                    <button class="bg-[#0f0f14] border border-[#2d2d41] text-[#7850ff] px-2.5 py-1 rounded text-[9px] font-bold">SELECT</button>
                                </div>
                            </div>

                            <span class="text-[9px] font-bold text-[#a0a0af] uppercase tracking-wider mt-1">EXECUTION</span>

                            <button class="w-full bg-[#7850ff] hover:bg-[#8c64ff] text-white rounded-lg py-2.5 text-[10px] font-bold shadow-md shadow-[#7850ff]/20">
                                REPLACE 14 OBJECTS
                            </button>

                            <div class="text-center">
                                <span class="text-[9px] text-[#a0a0af] hover:text-white cursor-pointer underline">Clear All Selection</span>
                            </div>
                        </div>

                        <div class="h-[26px] bg-[#0f0f14] border-t border-[#2d2d41] px-3 flex items-center gap-2">
                            <span class="text-[#41dc87] text-[8px]">●</span>
                            <span class="text-[9px] text-[#a0a0af] truncate">Source folder loaded successfully.</span>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            const editor = document.getElementById('editor-section');
            const preview = document.getElementById('preview-section');
            
            if(tab === 'editor') {
                editor.classList.remove('hidden');
                editor.classList.add('flex');
                preview.classList.add('hidden');
                preview.classList.remove('flex');
            } else {
                editor.classList.add('hidden');
                editor.classList.remove('flex');
                preview.classList.remove('hidden');
                preview.classList.add('flex');
            }
        }

        function parseAndPreview() {
            const codeInput = document.getElementById('luau-code').value;
            if(window.innerWidth < 768) {
                switchTab('preview');
            }
            // Simulasi pembaruan interaktif berdasarkan teks yang dimasukkan
            const panel = document.getElementById('simulated-panel');
            panel.style.transform = 'scale(0.98)';
            setTimeout(() => { panel.style.transform = 'scale(1)'; }, 150);
        }

        // Muat isi default dari script Anda ke text area
        window.onload = function() {
            // Text area sudah diisi template di atas
        }
    </script>
</body>
</html>
